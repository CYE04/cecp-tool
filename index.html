<!DOCTYPE html>
<html lang="zh-CN" data-theme="ocean">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CECP 专注倒计时</title>
  <link rel="icon" type="image/svg+xml" href="./cecp-logo.svg" />
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #e4e9f2 100%);
      --card-bg: rgba(255, 255, 255, 0.84);
      --card-border: rgba(255, 255, 255, 0.95);
      --surface-2: rgba(15, 23, 42, 0.05);
      --text: #1e293b;
      --text-muted: #64748b;
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, 0.12);
      --accent-glow: rgba(37, 99, 235, 0.25);
      --ring-bg: rgba(15, 23, 42, 0.08);
      --shadow: 0 12px 40px rgba(15, 23, 42, 0.08);
    }

    [data-theme="ocean"] {
      --bg-gradient: radial-gradient(circle at 20% 20%, #1e3a5f 0%, #0f172a 55%, #090d16 100%);
      --card-bg: rgba(15, 23, 42, 0.62);
      --card-border: rgba(148, 163, 184, 0.18);
      --surface-2: rgba(255, 255, 255, 0.08);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.16);
      --accent-glow: rgba(56, 189, 248, 0.35);
      --ring-bg: rgba(255, 255, 255, 0.1);
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    [data-theme="sunset"] {
      --bg-gradient: radial-gradient(circle at 80% 15%, #7c2d12 0%, #4c1d95 55%, #1e1b4b 100%);
      --card-bg: rgba(24, 16, 42, 0.58);
      --card-border: rgba(251, 146, 60, 0.22);
      --surface-2: rgba(255, 255, 255, 0.09);
      --text: #fff7ed;
      --text-muted: #cbd5e1;
      --accent: #fb923c;
      --accent-soft: rgba(251, 146, 60, 0.18);
      --accent-glow: rgba(251, 146, 60, 0.35);
      --ring-bg: rgba(255, 255, 255, 0.12);
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    [data-theme="forest"] {
      --bg-gradient: radial-gradient(circle at 25% 80%, #14532d 0%, #064e3b 45%, #052e16 100%);
      --card-bg: rgba(6, 36, 26, 0.6);
      --card-border: rgba(74, 222, 128, 0.18);
      --surface-2: rgba(255, 255, 255, 0.08);
      --text: #ecfdf5;
      --text-muted: #a7f3d0;
      --accent: #34d399;
      --accent-soft: rgba(52, 211, 153, 0.16);
      --accent-glow: rgba(52, 211, 153, 0.32);
      --ring-bg: rgba(255, 255, 255, 0.1);
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    [data-theme="midnight"] {
      --bg-gradient: radial-gradient(circle at 50% 0%, #18181b 0%, #09090b 100%);
      --card-bg: rgba(24, 24, 27, 0.74);
      --card-border: rgba(255, 255, 255, 0.1);
      --surface-2: rgba(255, 255, 255, 0.07);
      --text: #fafafa;
      --text-muted: #a1a1aa;
      --accent: #a78bfa;
      --accent-soft: rgba(167, 139, 250, 0.16);
      --accent-glow: rgba(167, 139, 250, 0.32);
      --ring-bg: rgba(255, 255, 255, 0.09);
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg-gradient);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
      transition: background 0.4s ease, color 0.25s ease;
    }

    .app {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 顶部栏 */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.94);
      padding: 4px;
      display: grid;
      place-items: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
      flex-shrink: 0;
    }

    .brand-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .brand-title {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .theme-dots {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      padding: 6px 10px;
      border-radius: 999px;
    }

    .theme-dot {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
    }

    .theme-dot:hover {
      transform: scale(1.15);
    }

    .theme-dot.active {
      border-color: var(--text);
      transform: scale(1.15);
    }

    .pill-btn {
      height: 32px;
      padding: 0 10px;
      border-radius: 999px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      color: var(--text);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: border-color 0.15s, transform 0.15s;
    }

    .pill-btn:hover {
      border-color: var(--accent);
      transform: scale(1.04);
    }

    /* 主卡片 */
    .glass-card {
      position: relative;
      background: var(--card-bg);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 22px 22px 24px;
      box-shadow: var(--shadow);
    }

    .focus-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .status-badge {
      font-size: 0.76rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
    }

    .today-stat {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    /* 陪伴小猫咪 */
    .cat-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 10px;
    }

    .cat-svg {
      width: 112px;
      height: 76px;
      overflow: visible;
    }

    .cat-tail {
      transform-origin: 86px 58px;
      animation: tailSway 2.8s ease-in-out infinite;
    }

    .cat-running .cat-tail {
      animation: tailSway 1.2s ease-in-out infinite;
    }

    .cat-eye {
      transform-origin: center;
      animation: blink 4.5s infinite;
    }

    .cat-sleep-z {
      opacity: 0;
      font-size: 11px;
      font-weight: 700;
      fill: var(--accent);
    }

    .cat-paused .cat-sleep-z {
      animation: floatZ 2.2s ease-in-out infinite;
    }

    .cat-heart {
      opacity: 0;
      fill: #fb7185;
    }

    .cat-done .cat-heart {
      animation: popHeart 1.4s ease-out infinite;
    }

    .cat-bubble {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 2px;
      min-height: 18px;
    }

    @keyframes tailSway {
      0%, 100% { transform: rotate(-6deg); }
      50% { transform: rotate(10deg); }
    }

    @keyframes blink {
      0%, 92%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.1); }
    }

    @keyframes floatZ {
      0% { opacity: 0; transform: translate(0, 4px); }
      50% { opacity: 0.9; }
      100% { opacity: 0; transform: translate(6px, -10px); }
    }

    @keyframes popHeart {
      0% { opacity: 0; transform: translateY(4px) scale(0.7); }
      40% { opacity: 1; transform: translateY(-4px) scale(1.1); }
      100% { opacity: 0; transform: translateY(-12px) scale(0.9); }
    }

    /* 任务栏 */
    .task-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface-2);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 8px 12px;
      margin-bottom: 16px;
    }

    .task-check {
      width: 17px;
      height: 17px;
      accent-color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
    }

    .task-input {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
    }

    .task-input::placeholder {
      color: var(--text-muted);
    }

    .task-input.done {
      text-decoration: line-through;
      opacity: 0.6;
    }

    /* 预设模式 */
    .timer-modes {
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .mode-chip {
      padding: 5px 12px;
      border-radius: 999px;
      border: 1px solid transparent;
      background: var(--surface-2);
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .mode-chip:hover {
      color: var(--text);
    }

    .mode-chip.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    .custom-row {
      display: none;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .custom-row.show {
      display: flex;
    }

    .custom-input {
      width: 84px;
      padding: 6px 10px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 0.88rem;
      text-align: center;
      outline: none;
    }

    /* 计时圆环 */
    .ring-wrap {
      position: relative;
      width: 214px;
      height: 214px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
    }

    .ring-wrap svg {
      position: absolute;
      inset: 0;
      transform: rotate(-90deg);
    }

    .ring-wrap circle {
      fill: none;
      stroke-width: 7;
    }

    .ring-bg {
      stroke: var(--ring-bg);
    }

    .ring-fg {
      stroke: var(--accent);
      stroke-linecap: round;
      filter: drop-shadow(0 0 8px var(--accent-glow));
      transition: stroke-dashoffset 0.35s linear;
    }

    .time-text {
      font-size: 3rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.03em;
      text-align: center;
      line-height: 1.1;
    }

    .time-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: 4px;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .btn {
      padding: 10px 20px;
      border-radius: 12px;
      border: none;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s, opacity 0.15s;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: var(--accent);
      color: #0b1120;
      min-width: 112px;
      box-shadow: 0 4px 16px var(--accent-glow);
    }

    [data-theme="light"] .btn-primary {
      color: #fff;
    }

    .btn-ghost {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--card-border);
    }

    /* 底部白噪音 */
    .sound-bar {
      background: var(--card-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 11px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .sound-buttons {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .sound-label {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-right: 2px;
    }

    .sound-chip {
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid var(--card-border);
      background: var(--surface-2);
      color: var(--text-muted);
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .sound-chip.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }

    .volume-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    input[type="range"] {
      width: 78px;
      accent-color: var(--accent);
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- 顶部：CECP Logo + 主题 + 语言 + 全屏 -->
    <header class="topbar">
      <div class="brand">
        <div class="brand-logo">
          <img src="./cecp-logo.svg" alt="CECP Logo" />
        </div>
        <span class="brand-title" id="brandTitle">CECP 专注倒计时</span>
      </div>

      <div class="topbar-right">
        <div class="theme-dots" title="切换主题">
          <button class="theme-dot" data-theme-pick="light" style="background: #e2e8f0;" title="极简纸白"></button>
          <button class="theme-dot active" data-theme-pick="ocean" style="background: #0ea5e9;" title="深海静谧"></button>
          <button class="theme-dot" data-theme-pick="sunset" style="background: #fb923c;" title="日落余晖"></button>
          <button class="theme-dot" data-theme-pick="forest" style="background: #10b981;" title="森林呼吸"></button>
          <button class="theme-dot" data-theme-pick="midnight" style="background: #8b5cf6;" title="暗夜极客"></button>
        </div>
        <button class="pill-btn" id="langBtn" title="Switch Language">EN</button>
        <button class="pill-btn" id="fullscreenBtn" title="全屏">⛶</button>
      </div>
    </header>

    <!-- 主卡片 -->
    <main class="glass-card">
      <div class="focus-header">
        <span class="status-badge" id="timerStatus">准备就绪</span>
        <span class="today-stat"><span id="todayLabel">今日完成</span> <strong id="completedCount">0</strong></span>
      </div>

      <!-- 陪伴小猫咪 -->
      <div class="cat-stage" id="catStage">
        <svg class="cat-svg" viewBox="0 0 120 80" aria-hidden="true">
          <!-- 尾巴 -->
          <path class="cat-tail" d="M 86 58 Q 108 54 106 36 Q 105 28 99 30" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" />
          <!-- 身体 -->
          <ellipse cx="60" cy="56" rx="28" ry="18" fill="var(--surface-2)" stroke="var(--accent)" stroke-width="2.5" />
          <!-- 头 -->
          <circle cx="56" cy="36" r="18" fill="var(--surface-2)" stroke="var(--accent)" stroke-width="2.5" />
          <!-- 左耳 & 右耳 -->
          <polygon points="41,25 38,10 50,20" fill="var(--accent)" />
          <polygon points="71,25 74,10 62,20" fill="var(--accent)" />
          <!-- 眼睛 -->
          <ellipse class="cat-eye" cx="49" cy="35" rx="2.4" ry="3" fill="var(--text)" />
          <ellipse class="cat-eye" cx="63" cy="35" rx="2.4" ry="3" fill="var(--text)" />
          <!-- 腮红 -->
          <ellipse cx="43" cy="40" rx="3.2" ry="1.8" fill="#fb7185" opacity="0.55" />
          <ellipse cx="69" cy="40" rx="3.2" ry="1.8" fill="#fb7185" opacity="0.55" />
          <!-- 鼻子与嘴巴 -->
          <polygon points="54.5,39 57.5,39 56,41" fill="#fb7185" />
          <path d="M 52 42 Q 54 45 56 42 Q 58 45 60 42" fill="none" stroke="var(--text)" stroke-width="1.4" stroke-linecap="round" />
          <!-- 小爪子 -->
          <ellipse cx="46" cy="68" rx="6" ry="4" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2" />
          <ellipse cx="70" cy="68" rx="6" ry="4" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2" />
          <!-- 暂停 Zzz & 完成爱心 -->
          <text class="cat-sleep-z" x="78" y="22">Zzz</text>
          <path class="cat-heart" d="M 85 20 C 85 17 81 17 81 20 C 81 23 85 26 85 26 C 85 26 89 23 89 20 C 89 17 85 17 85 20 Z" />
        </svg>
        <div class="cat-bubble" id="catBubble">小猫准备好陪你专注啦</div>
      </div>

      <!-- 单行任务 -->
      <div class="task-bar">
        <input type="checkbox" class="task-check" id="taskCheck" />
        <input type="text" class="task-input" id="taskInput" placeholder="写下这次要专注的事..." />
      </div>

      <!-- 模式选择 -->
      <div class="timer-modes">
        <button class="mode-chip active" data-minutes="25" data-key="pomodoro">专注 25m</button>
        <button class="mode-chip" data-minutes="5" data-key="short">短休 5m</button>
        <button class="mode-chip" data-minutes="15" data-key="long">长休 15m</button>
        <button class="mode-chip" id="customModeBtn">自定义</button>
      </div>

      <div class="custom-row" id="customRow">
        <input type="number" class="custom-input" id="customInput" min="1" max="180" value="45" />
        <span id="minUnit" style="font-size: 0.84rem; color: var(--text-muted);">分钟</span>
        <button class="btn btn-ghost" id="applyCustomBtn" style="padding: 6px 12px; font-size: 0.82rem;">应用</button>
      </div>

      <!-- 倒计时圆环 -->
      <div class="ring-wrap">
        <svg viewBox="0 0 214 214" width="214" height="214">
          <circle class="ring-bg" cx="107" cy="107" r="96"></circle>
          <circle class="ring-fg" id="timerRing" cx="107" cy="107" r="96"></circle>
        </svg>
        <div>
          <div class="time-text" id="timerDisplay">25:00</div>
          <div class="time-sub" id="timerModeLabel">番茄专注</div>
        </div>
      </div>

      <div class="controls">
        <button class="btn btn-primary" id="timerStartBtn">开始</button>
        <button class="btn btn-ghost" id="timerResetBtn">重置</button>
      </div>
    </main>

    <!-- 底部白噪音 -->
    <div class="sound-bar">
      <div class="sound-buttons">
        <span class="sound-label" id="soundTitle">白噪音</span>
        <button class="sound-chip" data-sound="rain">🌧️ <span data-i18n="rain">细雨</span></button>
        <button class="sound-chip" data-sound="wave">🌊 <span data-i18n="wave">海浪</span></button>
        <button class="sound-chip" data-sound="fire">🔥 <span data-i18n="fire">暖噪</span></button>
      </div>
      <div class="volume-wrap">
        <span>🔈</span>
        <input type="range" id="volumeSlider" min="0" max="100" value="45" />
      </div>
    </div>
  </div>

  <script>
    // ---------- 多语言配置 ----------
    const i18n = {

        apply: '应用',
        start: '开始',
        pause: '暂停',
        resume: '继续',
        reset: '重置',

        wave: '海浪',
        fire: '暖噪',
        notifyTitle: '⏰ 倒计时结束',

      },
      en: {

        ready: 'Ready',

        done: 'Completed!',
        todayLabel: 'Today',
        taskPlaceholder: 'What are you focusing on?',
        pomodoro: 'Focus 25m',
        short: 'Short 5m',
        long: 'Long 15m',
        custom: 'Custom',
        minUnit: 'min',
        apply: 'Apply',
        start: 'Start',
        pause: 'Pause',
        resume: 'Resume',
        reset: 'Reset',
        modePomodoro: 'Focus Session',
        modeShort: 'Short Break',
        modeLong: 'Long Break',
        modeCustom: 'Custom Timer',
        catReady: 'Kitty is ready to focus with you',
        catRunning: 'Shh... Kitty is quietly cheering for you',
        catPaused: 'Kitty is taking a quick nap...',
        catDone: 'Awesome job! Time is up 🎉',
        soundTitle: 'Ambient',
        rain: 'Rain',
        wave: 'Waves',
        fire: 'Warm',
        notifyTitle: '⏰ Time is up!',
        notifyBody: 'Great work! Take a short break.'
      }
    };

    let lang = localStorage.getItem('cecp_timer_lang') || 'zh';
    const langBtn = document.getElementById('langBtn');

    function t(key) {
      return i18n[lang][key] || key;
    }

    function applyLang() {
      langBtn.textContent = lang === 'zh' ? 'EN' : '中';
      document.getElementById('brandTitle').textContent = t('brandTitle');
      document.getElementById('todayLabel').textContent = t('todayLabel');
      document.getElementById('taskInput').placeholder = t('taskPlaceholder');
      document.querySelector('[data-key="pomodoro"]').textContent = t('pomodoro');
      document.querySelector('[data-key="short"]').textContent = t('short');
      document.querySelector('[data-key="long"]').textContent = t('long');
      document.getElementById('customModeBtn').textContent = t('custom');
      document.getElementById('minUnit').textContent = t('minUnit');
      document.getElementById('applyCustomBtn').textContent = t('apply');
      document.getElementById('timerResetBtn').textContent = t('reset');
      document.getElementById('soundTitle').textContent = t('soundTitle');
      document.querySelector('[data-i18n="rain"]').textContent = t('rain');
      document.querySelector('[data-i18n="wave"]').textContent = t('wave');
      document.querySelector('[data-i18n="fire"]').textContent = t('fire');
      syncStateLabels();
    }

    langBtn.addEventListener('click', () => {
      lang = lang === 'zh' ? 'en' : 'zh';
      localStorage.setItem('cecp_timer_lang', lang);
      applyLang();
    });

    // ---------- 主题切换 ----------
    const html = document.documentElement;
    const themeDots = document.querySelectorAll('.theme-dot');

    function setTheme(theme) {
      html.setAttribute('data-theme', theme);
      localStorage.setItem('cecp_focus_theme', theme);
      themeDots.forEach(d => d.classList.toggle('active', d.dataset.themePick === theme));
    }

    setTheme(localStorage.getItem('cecp_focus_theme') || 'ocean');
    themeDots.forEach(dot => dot.addEventListener('click', () => setTheme(dot.dataset.themePick)));

    // 全屏
    document.getElementById('fullscreenBtn').addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen?.();
      } else {
        document.exitFullscreen?.();
      }
    });

    // ---------- 任务记忆 ----------
    const taskInput = document.getElementById('taskInput');
    const taskCheck = document.getElementById('taskCheck');
    taskInput.value = localStorage.getItem('cecp_focus_task') || '';
    taskInput.addEventListener('input', () => localStorage.setItem('cecp_focus_task', taskInput.value));
    taskCheck.addEventListener('change', () => taskInput.classList.toggle('done', taskCheck.checked));

    // ---------- 精准时间戳倒计时 ----------
    const COUNT_KEY = 'cecp_focus_completed_v1';
    const completedCountEl = document.getElementById('completedCount');
    const timerDisplay = document.getElementById('timerDisplay');
    const timerModeLabel = document.getElementById('timerModeLabel');
    const timerStatus = document.getElementById('timerStatus');
    const timerRing = document.getElementById('timerRing');
    const timerStartBtn = document.getElementById('timerStartBtn');
    const timerResetBtn = document.getElementById('timerResetBtn');
    const catStage = document.getElementById('catStage');
    const catBubble = document.getElementById('catBubble');
    const modeChips = document.querySelectorAll('.mode-chip[data-minutes]');
    const customModeBtn = document.getElementById('customModeBtn');
    const customRow = document.getElementById('customRow');

    const CIRCUMFERENCE = 2 * Math.PI * 96;
    timerRing.style.strokeDasharray = CIRCUMFERENCE;

    let totalSeconds = 25 * 60;
    let remainingSeconds = totalSeconds;
    let endTimeMs = null;
    let timerInterval = null;
    let timerState = 'ready'; // ready | running | paused | done
    let currentModeKey = 'pomodoro';

    function getTodayKey() {
      const d = new Date();
      return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
    }

    function loadCount() {
      try {
        const d = JSON.parse(localStorage.getItem(COUNT_KEY) || '{}');
        return d.date === getTodayKey() ? (d.count || 0) : 0;
      } catch { return 0; }
    }

    function addCount() {
      const next = loadCount() + 1;
      localStorage.setItem(COUNT_KEY, JSON.stringify({ date: getTodayKey(), count: next }));
      completedCountEl.textContent = next;
    }

    completedCountEl.textContent = loadCount();

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function syncStateLabels() {
      const modeMap = {
        pomodoro: t('modePomodoro'),
        short: t('modeShort'),
        long: t('modeLong'),
        custom: t('modeCustom')
      };
      timerModeLabel.textContent = modeMap[currentModeKey] || t('modePomodoro');

      catStage.classList.remove('cat-running', 'cat-paused', 'cat-done');
      if (timerState === 'running') {
        timerStatus.textContent = t('running');
        timerStartBtn.textContent = t('pause');
        catStage.classList.add('cat-running');
        catBubble.textContent = t('catRunning');
      } else if (timerState === 'paused') {
        timerStatus.textContent = t('paused');
        timerStartBtn.textContent = t('resume');
        catStage.classList.add('cat-paused');
        catBubble.textContent = t('catPaused');
      } else if (timerState === 'done') {
        timerStatus.textContent = t('done');
        timerStartBtn.textContent = t('start');
        catStage.classList.add('cat-done');
        catBubble.textContent = t('catDone');
      } else {
        timerStatus.textContent = t('ready');
        timerStartBtn.textContent = t('start');
        catBubble.textContent = t('catReady');
      }
    }

    function updateTimerUI() {
      const str = formatTime(remainingSeconds);
      timerDisplay.textContent = str;
      document.title = timerState === 'running' ? `${str} · ${t('brandTitle')}` : t('brandTitle');
      const ratio = totalSeconds > 0 ? remainingSeconds / totalSeconds : 0;
      timerRing.style.strokeDashoffset = CIRCUMFERENCE * (1 - ratio);
    }

    function playChime() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.001, ctx.currentTime + i * 0.14);
          gain.gain.exponentialRampToValueAtTime(0.16, ctx.currentTime + i * 0.14 + 0.04);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.14 + 0.6);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + i * 0.14);
          osc.stop(ctx.currentTime + i * 0.14 + 0.65);
        });
      } catch {}
    }

    function sendNotification() {
      if ('Notification' in window && Notification.permission === 'granted') {
        try {
          new Notification(t('notifyTitle'), { body: t('notifyBody'), icon: './cecp-logo.svg' });
        } catch {}
      }
    }

    function stopInterval() {
      clearInterval(timerInterval);
      timerInterval = null;
    }

    function tick() {
      if (timerState !== 'running' || !endTimeMs) return;
      const diff = Math.max(0, Math.ceil((endTimeMs - Date.now()) / 1000));
      remainingSeconds = diff;
      updateTimerUI();

      if (diff <= 0) {
        stopInterval();
        timerState = 'done';
        endTimeMs = null;
        addCount();
        playChime();
        sendNotification();
        syncStateLabels();
        updateTimerUI();
      }
    }

    function setMinutes(mins, modeKey) {
      stopInterval();
      currentModeKey = modeKey;
      totalSeconds = mins * 60;
      remainingSeconds = totalSeconds;
      endTimeMs = null;
      timerState = 'ready';
      syncStateLabels();
      updateTimerUI();
    }

    modeChips.forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('.mode-chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        customRow.classList.remove('show');
        setMinutes(Number(chip.dataset.minutes), chip.dataset.key);
      });
    });

    customModeBtn.addEventListener('click', () => {
      document.querySelectorAll('.mode-chip').forEach(c => c.classList.remove('active'));
      customModeBtn.classList.add('active');
      customRow.classList.add('show');
    });

    document.getElementById('applyCustomBtn').addEventListener('click', () => {
      const m = Math.max(1, Math.min(180, Number(document.getElementById('customInput').value) || 25));
      setMinutes(m, 'custom');
    });

    timerStartBtn.addEventListener('click', () => {
      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission().catch(() => {});
      }

      if (timerState === 'running') {
        tick();
        stopInterval();
        timerState = 'paused';
        endTimeMs = null;
        syncStateLabels();
        updateTimerUI();
        return;
      }

      if (remainingSeconds <= 0) remainingSeconds = totalSeconds;
      endTimeMs = Date.now() + remainingSeconds * 1000;
      timerState = 'running';
      syncStateLabels();
      updateTimerUI();
      timerInterval = setInterval(tick, 250);
    });

    timerResetBtn.addEventListener('click', () => {
      stopInterval();
      remainingSeconds = totalSeconds;
      endTimeMs = null;
      timerState = 'ready';
      syncStateLabels();
      updateTimerUI();
    });

    // 切回页面时立刻同步真实时间
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && timerState === 'running') tick();
    });

    applyLang();
    updateTimerUI();

    // ---------- 纯代码合成白噪音 ----------
    let audioCtx = null;
    let masterGain = null;
    let currentSource = null;
    let currentLfo = null;
    let activeSound = null;

    const soundChips = document.querySelectorAll('.sound-chip');
    const volumeSlider = document.getElementById('volumeSlider');

    function stopAmbientSound() {
      if (currentSource) {
        try { currentSource.stop(); } catch {}
        currentSource.disconnect();
        currentSource = null;
      }
      if (currentLfo) {
        try { currentLfo.stop(); } catch {}
        currentLfo.disconnect();
        currentLfo = null;
      }
      activeSound = null;
      soundChips.forEach(c => c.classList.remove('active'));
    }

    function startAmbientSound(type) {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = audioCtx.createGain();
        masterGain.gain.value = (volumeSlider.value / 100) * 0.35;
        masterGain.connect(audioCtx.destination);
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();

      stopAmbientSound();

      const bufferSize = audioCtx.sampleRate * 3;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);

      let lastOut = 0;
      for (let i = 0; i < bufferSize; i++) {
        const white = Math.random() * 2 - 1;
        if (type === 'rain') {
          data[i] = (lastOut + 0.08 * white) / 1.08;
          lastOut = data[i];
        } else {
          data[i] = (lastOut + 0.02 * white) / 1.02;
          lastOut = data[i];
          data[i] *= 2.4;
        }
      }

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      noise.loop = true;

      const filter = audioCtx.createBiquadFilter();
      if (type === 'rain') {
        filter.type = 'bandpass';
        filter.frequency.value = 1100;
        filter.Q.value = 0.6;
        noise.connect(filter);
        filter.connect(masterGain);
      } else if (type === 'wave') {
        filter.type = 'lowpass';
        filter.frequency.value = 420;
        const waveGain = audioCtx.createGain();
        waveGain.gain.value = 0.65;

        const lfo = audioCtx.createOscillator();
        const lfoGain = audioCtx.createGain();
        lfo.frequency.value = 0.12;
        lfoGain.gain.value = 0.35;
        lfo.connect(lfoGain);
        lfoGain.connect(waveGain.gain);
        lfo.start();
        currentLfo = lfo;

        noise.connect(filter);
        filter.connect(waveGain);
        waveGain.connect(masterGain);
      } else {
        filter.type = 'lowpass';
        filter.frequency.value = 260;
        noise.connect(filter);
        filter.connect(masterGain);
      }

      noise.start();
      currentSource = noise;
      activeSound = type;
      soundChips.forEach(c => c.classList.toggle('active', c.dataset.sound === type));
    }

    soundChips.forEach(chip => {
      chip.addEventListener('click', () => {
        if (activeSound === chip.dataset.sound) {
          stopAmbientSound();
        } else {
          startAmbientSound(chip.dataset.sound);
        }
      });
    });

    volumeSlider.addEventListener('input', () => {
      if (masterGain && audioCtx) {
        masterGain.gain.setTargetAtTime((volumeSlider.value / 100) * 0.35, audioCtx.currentTime, 0.05);
      }
    });
  </script>
</body>
</html>
