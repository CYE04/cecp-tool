<!DOCTYPE html>
<html lang="zh-CN" data-theme="ocean">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>静谧专注空间</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #e4e9f2 100%);
      --card-bg: rgba(255, 255, 255, 0.78);
      --card-border: rgba(255, 255, 255, 0.9);
      --surface-2: rgba(15, 23, 42, 0.05);
      --text: #1e293b;
      --text-muted: #64748b;
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, 0.12);
      --accent-glow: rgba(37, 99, 235, 0.28);
      --ring-bg: rgba(15, 23, 42, 0.08);
      --shadow: 0 12px 40px rgba(15, 23, 42, 0.08);
    }

    [data-theme="ocean"] {
      --bg-gradient: radial-gradient(circle at 20% 20%, #1e3a5f 0%, #0f172a 55%, #090d16 100%);
      --card-bg: rgba(15, 23, 42, 0.58);
      --card-border: rgba(148, 163, 184, 0.18);
      --surface-2: rgba(255, 255, 255, 0.08);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.16);
      --accent-glow: rgba(56, 189, 248, 0.35);
      --ring-bg: rgba(255, 255, 255, 0.1);
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    [data-theme="sunset"] {
      --bg-gradient: radial-gradient(circle at 80% 15%, #7c2d12 0%, #4c1d95 55%, #1e1b4b 100%);
      --card-bg: rgba(24, 16, 42, 0.55);
      --card-border: rgba(251, 146, 60, 0.22);
      --surface-2: rgba(255, 255, 255, 0.09);
      --text: #fff7ed;
      --text-muted: #cbd5e1;
      --accent: #fb923c;
      --accent-soft: rgba(251, 146, 60, 0.18);
      --accent-glow: rgba(251, 146, 60, 0.35);
      --ring-bg: rgba(255, 255, 255, 0.12);
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    [data-theme="forest"] {
      --bg-gradient: radial-gradient(circle at 25% 80%, #14532d 0%, #064e3b 45%, #052e16 100%);
      --card-bg: rgba(6, 36, 26, 0.58);
      --card-border: rgba(74, 222, 128, 0.18);
      --surface-2: rgba(255, 255, 255, 0.08);
      --text: #ecfdf5;
      --text-muted: #a7f3d0;
      --accent: #34d399;
      --accent-soft: rgba(52, 211, 153, 0.16);
      --accent-glow: rgba(52, 211, 153, 0.32);
      --ring-bg: rgba(255, 255, 255, 0.1);
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    [data-theme="midnight"] {
      --bg-gradient: radial-gradient(circle at 50% 0%, #18181b 0%, #09090b 100%);
      --card-bg: rgba(24, 24, 27, 0.72);
      --card-border: rgba(255, 255, 255, 0.1);
      --surface-2: rgba(255, 255, 255, 0.07);
      --text: #fafafa;
      --text-muted: #a1a1aa;
      --accent: #a78bfa;
      --accent-soft: rgba(167, 139, 250, 0.16);
      --accent-glow: rgba(167, 139, 250, 0.32);
      --ring-bg: rgba(255, 255, 255, 0.09);
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg-gradient);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
      transition: background 0.4s ease, color 0.25s ease;
    }

    .app {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* 顶部栏 */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .nav-pills {
      display: flex;
      gap: 4px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      padding: 4px;
      border-radius: 999px;
    }

    .nav-pill {
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s;
    }

    .nav-pill:hover {
      color: var(--text);
    }

    .nav-pill.active {
      background: var(--accent);
      color: #0b1120;
    }

    [data-theme="light"] .nav-pill.active {
      color: #fff;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .theme-dots {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      padding: 6px 10px;
      border-radius: 999px;
    }

    .theme-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
    }

    .theme-dot:hover {
      transform: scale(1.15);
    }

    .theme-dot.active {
      border-color: var(--text);
      transform: scale(1.15);
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      color: var(--text);
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: 0.9rem;
      transition: border-color 0.15s, transform 0.15s;
    }

    .icon-btn:hover {
      border-color: var(--accent);
      transform: scale(1.05);
    }

    /* 主毛玻璃卡片 */
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 26px 22px;
      box-shadow: var(--shadow);
    }

    .view {
      display: none;
    }

    .view.active {
      display: block;
      animation: fadeUp 0.22s ease-out;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 专注倒计时 */
    .focus-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .status-badge {
      font-size: 0.76rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
    }

    .today-stat {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .task-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface-2);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 8px 12px;
      margin-bottom: 20px;
    }

    .task-check {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
    }

    .task-input {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 0.92rem;
      font-family: inherit;
      outline: none;
    }

    .task-input::placeholder {
      color: var(--text-muted);
    }

    .task-input.done {
      text-decoration: line-through;
      opacity: 0.6;
    }

    .timer-modes {
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .mode-chip {
      padding: 5px 12px;
      border-radius: 999px;
      border: 1px solid transparent;
      background: var(--surface-2);
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .mode-chip:hover {
      color: var(--text);
    }

    .mode-chip.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    .custom-row {
      display: none;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
    }

    .custom-row.show {
      display: flex;
    }

    .custom-input {
      width: 86px;
      padding: 6px 10px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 0.88rem;
      text-align: center;
      outline: none;
    }

    .ring-wrap {
      position: relative;
      width: 230px;
      height: 230px;
      margin: 0 auto 22px;
      display: grid;
      place-items: center;
    }

    .ring-wrap svg {
      position: absolute;
      inset: 0;
      transform: rotate(-90deg);
    }

    .ring-wrap circle {
      fill: none;
      stroke-width: 7;
    }

    .ring-bg {
      stroke: var(--ring-bg);
    }

    .ring-fg {
      stroke: var(--accent);
      stroke-linecap: round;
      filter: drop-shadow(0 0 8px var(--accent-glow));
      transition: stroke-dashoffset 0.35s linear;
    }

    .time-text {
      font-size: 3.1rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.03em;
      text-align: center;
      line-height: 1.1;
    }

    .time-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: 4px;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .btn {
      padding: 10px 20px;
      border-radius: 12px;
      border: none;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s, opacity 0.15s;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: var(--accent);
      color: #0b1120;
      min-width: 108px;
      box-shadow: 0 4px 16px var(--accent-glow);
    }

    [data-theme="light"] .btn-primary {
      color: #fff;
    }

    .btn-ghost {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--card-border);
    }

    /* 呼吸引导模式 */
    .breath-box {
      text-align: center;
      padding: 14px 0 8px;
    }

    .breath-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 26px;
    }

    .breath-stage {
      height: 220px;
      display: grid;
      place-items: center;
      margin-bottom: 22px;
      position: relative;
    }

    .breath-orb {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--accent) 0%, var(--accent-soft) 70%);
      box-shadow: 0 0 40px var(--accent-glow);
      display: grid;
      place-items: center;
      transition: transform 1s ease-in-out;
    }

    .breath-label {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .breath-sec {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      margin-bottom: 18px;
    }

    /* 时间进度条模式 */
    .progress-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .prog-item {
      background: var(--surface-2);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px 16px;
    }

    .prog-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
    }

    .prog-title {
      font-size: 0.92rem;
      font-weight: 700;
    }

    .prog-pct {
      font-size: 0.92rem;
      font-weight: 800;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    .prog-track {
      height: 8px;
      border-radius: 999px;
      background: var(--ring-bg);
      overflow: hidden;
    }

    .prog-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
      transition: width 0.5s ease;
    }

    .prog-sub {
      font-size: 0.76rem;
      color: var(--text-muted);
      margin-top: 6px;
    }

    /* 底部白噪音控制栏 */
    .sound-bar {
      background: var(--card-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .sound-buttons {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .sound-label {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-right: 4px;
    }

    .sound-chip {
      padding: 5px 11px;
      border-radius: 999px;
      border: 1px solid var(--card-border);
      background: var(--surface-2);
      color: var(--text-muted);
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .sound-chip.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }

    .volume-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    input[type="range"] {
      width: 82px;
      accent-color: var(--accent);
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- 顶部导航 & 主题切换 -->
    <div class="topbar">
      <div class="nav-pills" role="tablist">
        <button class="nav-pill active" data-view="focus">🍅 专注</button>
        <button class="nav-pill" data-view="breath">🌬️ 呼吸</button>
        <button class="nav-pill" data-view="progress">⏳ 进度</button>
      </div>

      <div class="topbar-right">
        <div class="theme-dots" title="切换氛围主题">
          <button class="theme-dot" data-theme-pick="light" style="background: #e2e8f0;" title="极简纸白"></button>
          <button class="theme-dot active" data-theme-pick="ocean" style="background: #0ea5e9;" title="深海静谧"></button>
          <button class="theme-dot" data-theme-pick="sunset" style="background: #fb923c;" title="日落余晖"></button>
          <button class="theme-dot" data-theme-pick="forest" style="background: #10b981;" title="森林呼吸"></button>
          <button class="theme-dot" data-theme-pick="midnight" style="background: #8b5cf6;" title="暗夜极客"></button>
        </div>
        <button class="icon-btn" id="fullscreenBtn" title="全屏沉浸模式">⛶</button>
      </div>
    </div>

    <!-- 主卡片 -->
    <main class="glass-card">
      <!-- 1. 专注倒计时 -->
      <section class="view active" id="view-focus">
        <div class="focus-header">
          <span class="status-badge" id="timerStatus">准备就绪</span>
          <span class="today-stat">今日完成 <strong id="completedCount">0</strong> 次</span>
        </div>

        <div class="task-bar">
          <input type="checkbox" class="task-check" id="taskCheck" title="标记完成" />
          <input type="text" class="task-input" id="taskInput" placeholder="写下这次要专注的事..." />
        </div>

        <div class="timer-modes">
          <button class="mode-chip active" data-minutes="25" data-label="番茄专注">专注 25m</button>
          <button class="mode-chip" data-minutes="5" data-label="短休息">短休 5m</button>
          <button class="mode-chip" data-minutes="15" data-label="长休息">长休 15m</button>
          <button class="mode-chip" id="customModeBtn">自定义</button>
        </div>

        <div class="custom-row" id="customRow">
          <input type="number" class="custom-input" id="customInput" min="1" max="180" value="45" />
          <span style="font-size: 0.84rem; color: var(--text-muted);">分钟</span>
          <button class="btn btn-ghost" id="applyCustomBtn" style="padding: 6px 12px; font-size: 0.82rem;">应用</button>
        </div>

        <div class="ring-wrap">
          <svg viewBox="0 0 230 230" width="230" height="230">
            <circle class="ring-bg" cx="115" cy="115" r="104"></circle>
            <circle class="ring-fg" id="timerRing" cx="115" cy="115" r="104"></circle>
          </svg>
          <div>
            <div class="time-text" id="timerDisplay">25:00</div>
            <div class="time-sub" id="timerModeLabel">番茄专注</div>
          </div>
        </div>

        <div class="controls">
          <button class="btn btn-primary" id="timerStartBtn">开始</button>
          <button class="btn btn-ghost" id="timerResetBtn">重置</button>
        </div>
      </section>

      <!-- 2. 4-7-8 呼吸引导 -->
      <section class="view" id="view-breath">
        <div class="breath-box">
          <div class="breath-desc">4-7-8 呼吸放松法：跟着光球节奏缓慢呼吸，缓解疲劳与焦虑</div>
          <div class="breath-stage">
            <div class="breath-orb" id="breathOrb"></div>
          </div>
          <div class="breath-label" id="breathPhase">准备开始</div>
          <div class="breath-sec" id="breathSec">点击下方按钮开始 1 分钟放松</div>
          <button class="btn btn-primary" id="breathToggleBtn">开始呼吸</button>
        </div>
      </section>

      <!-- 3. 时间可视化进度 -->
      <section class="view" id="view-progress">
        <div class="progress-list" id="progressList"></div>
      </section>
    </main>

    <!-- 底部白噪音控制台 -->
    <div class="sound-bar">
      <div class="sound-buttons">
        <span class="sound-label">白噪音</span>
        <button class="sound-chip" data-sound="rain">🌧️ 细雨</button>
        <button class="sound-chip" data-sound="wave">🌊 海浪</button>
        <button class="sound-chip" data-sound="fire">🔥 暖噪</button>
      </div>
      <div class="volume-wrap">
        <span>🔈</span>
        <input type="range" id="volumeSlider" min="0" max="100" value="45" title="音量" />
      </div>
    </div>
  </div>

  <script>
    // ---------- 1. 主题切换 ----------
    const html = document.documentElement;
    const themeDots = document.querySelectorAll('.theme-dot');

    function setTheme(theme) {
      html.setAttribute('data-theme', theme);
      localStorage.setItem('cecp_focus_theme', theme);
      themeDots.forEach(d => d.classList.toggle('active', d.dataset.themePick === theme));
    }

    setTheme(localStorage.getItem('cecp_focus_theme') || 'ocean');
    themeDots.forEach(dot => dot.addEventListener('click', () => setTheme(dot.dataset.themePick)));

    // ---------- 2. 顶部视图切换 ----------
    const navPills = document.querySelectorAll('.nav-pill');
    const views = document.querySelectorAll('.view');
    navPills.forEach(pill => {
      pill.addEventListener('click', () => {
        navPills.forEach(p => p.classList.remove('active'));
        views.forEach(v => v.classList.remove('active'));
        pill.classList.add('active');
        document.getElementById('view-' + pill.dataset.view).classList.add('active');
        if (pill.dataset.view === 'progress') renderTimeProgress();
      });
    });

    // 全屏切换
    document.getElementById('fullscreenBtn').addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen?.();
      } else {
        document.exitFullscreen?.();
      }
    });

    // ---------- 3. 专注任务记忆 ----------
    const taskInput = document.getElementById('taskInput');
    const taskCheck = document.getElementById('taskCheck');
    taskInput.value = localStorage.getItem('cecp_focus_task') || '';
    taskInput.addEventListener('input', () => localStorage.setItem('cecp_focus_task', taskInput.value));
    taskCheck.addEventListener('change', () => taskInput.classList.toggle('done', taskCheck.checked));

    // ---------- 4. 专注倒计时 ----------
    const COUNT_KEY = 'cecp_focus_completed_v1';
    const completedCountEl = document.getElementById('completedCount');
    const timerDisplay = document.getElementById('timerDisplay');
    const timerModeLabel = document.getElementById('timerModeLabel');
    const timerStatus = document.getElementById('timerStatus');
    const timerRing = document.getElementById('timerRing');
    const timerStartBtn = document.getElementById('timerStartBtn');
    const timerResetBtn = document.getElementById('timerResetBtn');
    const modeChips = document.querySelectorAll('.mode-chip[data-minutes]');
    const customModeBtn = document.getElementById('customModeBtn');
    const customRow = document.getElementById('customRow');

    const CIRCUMFERENCE = 2 * Math.PI * 104;
    timerRing.style.strokeDasharray = CIRCUMFERENCE;

    let totalSeconds = 25 * 60;
    let remainingSeconds = totalSeconds;
    let timerInterval = null;
    let isRunning = false;

    function getTodayKey() {
      const d = new Date();
      return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
    }

    function loadCount() {
      try {
        const d = JSON.parse(localStorage.getItem(COUNT_KEY) || '{}');
        return d.date === getTodayKey() ? (d.count || 0) : 0;
      } catch { return 0; }
    }

    function addCount() {
      const next = loadCount() + 1;
      localStorage.setItem(COUNT_KEY, JSON.stringify({ date: getTodayKey(), count: next }));
      completedCountEl.textContent = next;
    }

    completedCountEl.textContent = loadCount();

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function updateTimerUI() {
      const str = formatTime(remainingSeconds);
      timerDisplay.textContent = str;
      document.title = isRunning ? `${str} · 专注中` : '静谧专注空间';
      const ratio = totalSeconds > 0 ? remainingSeconds / totalSeconds : 0;
      timerRing.style.strokeDashoffset = CIRCUMFERENCE * (1 - ratio);
    }

    function playChime() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.001, ctx.currentTime + i * 0.14);
          gain.gain.exponentialRampToValueAtTime(0.15, ctx.currentTime + i * 0.14 + 0.04);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.14 + 0.6);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + i * 0.14);
          osc.stop(ctx.currentTime + i * 0.14 + 0.65);
        });
      } catch {}
    }

    function stopTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
      isRunning = false;
      timerStartBtn.textContent = '开始';
    }

    function setMinutes(mins, label) {
      stopTimer();
      totalSeconds = mins * 60;
      remainingSeconds = totalSeconds;
      timerModeLabel.textContent = label;
      timerStatus.textContent = '准备就绪';
      updateTimerUI();
    }

    modeChips.forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('.mode-chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        customRow.classList.remove('show');
        setMinutes(Number(chip.dataset.minutes), chip.dataset.label);
      });
    });

    customModeBtn.addEventListener('click', () => {
      document.querySelectorAll('.mode-chip').forEach(c => c.classList.remove('active'));
      customModeBtn.classList.add('active');
      customRow.classList.add('show');
    });

    document.getElementById('applyCustomBtn').addEventListener('click', () => {
      const m = Math.max(1, Math.min(180, Number(document.getElementById('customInput').value) || 25));
      setMinutes(m, `自定义 ${m} 分钟`);
    });

    timerStartBtn.addEventListener('click', () => {
      if (isRunning) {
        stopTimer();
        timerStatus.textContent = '已暂停';
        timerStartBtn.textContent = '继续';
        updateTimerUI();
        return;
      }
      if (remainingSeconds <= 0) remainingSeconds = totalSeconds;
      isRunning = true;
      timerStartBtn.textContent = '暂停';
      timerStatus.textContent = '专注中...';
      updateTimerUI();
      timerInterval = setInterval(() => {
        remainingSeconds--;
        updateTimerUI();
        if (remainingSeconds <= 0) {
          stopTimer();
          timerStatus.textContent = '已完成！';
          addCount();
          playChime();
          updateTimerUI();
        }
      }, 1000);
    });

    timerResetBtn.addEventListener('click', () => {
      stopTimer();
      remainingSeconds = totalSeconds;
      timerStatus.textContent = '准备就绪';
      updateTimerUI();
    });

    updateTimerUI();

    // ---------- 5. 4-7-8 呼吸引导 ----------
    const breathOrb = document.getElementById('breathOrb');
    const breathPhase = document.getElementById('breathPhase');
    const breathSec = document.getElementById('breathSec');
    const breathToggleBtn = document.getElementById('breathToggleBtn');

    let breathTimer = null;
    let breathing = false;
    const steps = [
      { label: '深吸气...', secs: 4, scale: 1.65, transition: '4s ease-out' },
      { label: '屏住呼吸', secs: 7, scale: 1.65, transition: '0.3s linear' },
      { label: '缓缓呼气...', secs: 8, scale: 1.0, transition: '8s ease-in-out' }
    ];

    function runBreathStep(stepIdx, leftSec) {
      if (!breathing) return;
      const step = steps[stepIdx];
      if (leftSec === step.secs) {
        breathPhase.textContent = step.label;
        breathOrb.style.transition = `transform ${step.transition}`;
        breathOrb.style.transform = `scale(${step.scale})`;
      }
      breathSec.textContent = `${leftSec} 秒`;
      breathTimer = setTimeout(() => {
        if (leftSec > 1) {
          runBreathStep(stepIdx, leftSec - 1);
        } else {
          const next = (stepIdx + 1) % steps.length;
          runBreathStep(next, steps[next].secs);
        }
      }, 1000);
    }

    breathToggleBtn.addEventListener('click', () => {
      if (breathing) {
        breathing = false;
        clearTimeout(breathTimer);
        breathToggleBtn.textContent = '开始呼吸';
        breathPhase.textContent = '已暂停';
        breathSec.textContent = '点击按钮重新开始';
        breathOrb.style.transition = 'transform 0.6s ease';
        breathOrb.style.transform = 'scale(1)';
      } else {
        breathing = true;
        breathToggleBtn.textContent = '停止';
        runBreathStep(0, steps[0].secs);
      }
    });

    // ---------- 6. 时间可视化进度 ----------
    function renderTimeProgress() {
      const now = new Date();
      const year = now.getFullYear();

      const startOfYear = new Date(year, 0, 1);
      const endOfYear = new Date(year + 1, 0, 1);
      const yearPct = ((now - startOfYear) / (endOfYear - startOfYear)) * 100;
      const daysLeftYear = Math.ceil((endOfYear - now) / 86400000);

      const startOfMonth = new Date(year, now.getMonth(), 1);
      const endOfMonth = new Date(year, now.getMonth() + 1, 1);
      const monthPct = ((now - startOfMonth) / (endOfMonth - startOfMonth)) * 100;
      const daysLeftMonth = Math.ceil((endOfMonth - now) / 86400000);

      const dayOfWeek = (now.getDay() + 6) % 7; // 周一=0
      const startOfWeek = new Date(year, now.getMonth(), now.getDate() - dayOfWeek);
      const weekPct = ((now - startOfWeek) / (7 * 86400000)) * 100;

      const startOfDay = new Date(year, now.getMonth(), now.getDate());
      const dayPct = ((now - startOfDay) / 86400000) * 100;

      const items = [
        { title: `${year} 年已过`, pct: yearPct, sub: `距离年底还剩 ${daysLeftYear} 天` },
        { title: `本月 (${now.getMonth() + 1}月) 已过`, pct: monthPct, sub: `距离月末还剩 ${daysLeftMonth} 天` },
        { title: '本周已过', pct: weekPct, sub: '周一至周日进度' },
        { title: '今日已过', pct: dayPct, sub: `当前 ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}` }
      ];

      document.getElementById('progressList').innerHTML = items.map(it => `
        <div class="prog-item">
          <div class="prog-top">
            <span class="prog-title">${it.title}</span>
            <span class="prog-pct">${it.pct.toFixed(1)}%</span>
          </div>
          <div class="prog-track">
            <div class="prog-fill" style="width: ${Math.min(100, it.pct).toFixed(2)}%;"></div>
          </div>
          <div class="prog-sub">${it.sub}</div>
        </div>
      `).join('');
    }

    // ---------- 7. 纯代码合成白噪音 (Web Audio API) ----------
    let audioCtx = null;
    let masterGain = null;
    let currentSource = null;
    let currentLfo = null;
    let activeSound = null;

    const soundChips = document.querySelectorAll('.sound-chip');
    const volumeSlider = document.getElementById('volumeSlider');

    function stopAmbientSound() {
      if (currentSource) {
        try { currentSource.stop(); } catch {}
        currentSource.disconnect();
        currentSource = null;
      }
      if (currentLfo) {
        try { currentLfo.stop(); } catch {}
        currentLfo.disconnect();
        currentLfo = null;
      }
      activeSound = null;
      soundChips.forEach(c => c.classList.remove('active'));
    }

    function startAmbientSound(type) {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = audioCtx.createGain();
        masterGain.gain.value = (volumeSlider.value / 100) * 0.35;
        masterGain.connect(audioCtx.destination);
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();

      stopAmbientSound();

      // 生成 3 秒无缝噪音缓冲
      const bufferSize = audioCtx.sampleRate * 3;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);

      let lastOut = 0;
      for (let i = 0; i < bufferSize; i++) {
        const white = Math.random() * 2 - 1;
        if (type === 'rain') {
          // 粉红/柔化白噪
          data[i] = (lastOut + 0.08 * white) / 1.08;
          lastOut = data[i];
        } else {
          // 布朗噪音（更低沉，适合海浪/暖噪）
          data[i] = (lastOut + 0.02 * white) / 1.02;
          lastOut = data[i];
          data[i] *= 2.4;
        }
      }

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      noise.loop = true;

      const filter = audioCtx.createBiquadFilter();
      if (type === 'rain') {
        filter.type = 'bandpass';
        filter.frequency.value = 1100;
        filter.Q.value = 0.6;
        noise.connect(filter);
        filter.connect(masterGain);
      } else if (type === 'wave') {
        filter.type = 'lowpass';
        filter.frequency.value = 420;
        const waveGain = audioCtx.createGain();
        waveGain.gain.value = 0.65;

        // 用低频振荡器模拟海浪起伏
        const lfo = audioCtx.createOscillator();
        const lfoGain = audioCtx.createGain();
        lfo.frequency.value = 0.12; // ~8秒一个浪潮
        lfoGain.gain.value = 0.35;
        lfo.connect(lfoGain);
        lfoGain.connect(waveGain.gain);
        lfo.start();
        currentLfo = lfo;

        noise.connect(filter);
        filter.connect(waveGain);
        waveGain.connect(masterGain);
      } else {
        // 暖噪 / 炉火感
        filter.type = 'lowpass';
        filter.frequency.value = 260;
        noise.connect(filter);
        filter.connect(masterGain);
      }

      noise.start();
      currentSource = noise;
      activeSound = type;
      soundChips.forEach(c => c.classList.toggle('active', c.dataset.sound === type));
    }

    soundChips.forEach(chip => {
      chip.addEventListener('click', () => {
        if (activeSound === chip.dataset.sound) {
          stopAmbientSound();
        } else {
          startAmbientSound(chip.dataset.sound);
        }
      });
    });

    volumeSlider.addEventListener('input', () => {
      if (masterGain && audioCtx) {
        masterGain.gain.setTargetAtTime((volumeSlider.value / 100) * 0.35, audioCtx.currentTime, 0.05);
      }
    });
  </script>
</body>
</html>
