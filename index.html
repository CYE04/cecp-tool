<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CECP 专注空间</title>
  <style>
    :root {
      --bg: #0a0a0c;
      --card: #141416;
      --card-2: #1c1c1f;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f4f4f5;
      --text-muted: #71717a;
      --accent: #2f81f7;
      --accent-hover: #3b89f8;
      --accent-glow: rgba(47, 129, 247, 0.55);
      --ring-track: rgba(255, 255, 255, 0.08);
      --dot-past: #3f3f46;
      --dot-future: #1f1f23;
    }

    [data-theme="light"] {
      --bg: #f4f4f5;
      --card: #ffffff;
      --card-2: #f4f4f5;
      --border: rgba(0, 0, 0, 0.08);
      --text: #18181b;
      --text-muted: #71717a;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-glow: rgba(37, 99, 235, 0.4);
      --ring-track: rgba(0, 0, 0, 0.07);
      --dot-past: #a1a1aa;
      --dot-future: #e4e4e7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      -webkit-font-smoothing: antialiased;
      transition: background 0.2s, color 0.2s;
    }

    .app {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 顶部栏 */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .brand-logo {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: #ffffff;
      padding: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-logo svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .brand-name {
      font-size: 0.92rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .seg-control {
      display: flex;
      background: var(--card);
      border: 1px solid var(--border);
      padding: 3px;
      border-radius: 10px;
      gap: 2px;
    }

    .seg-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 5px 12px;
      border-radius: 7px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }

    .seg-btn:hover {
      color: var(--text);
    }

    .seg-btn.active {
      background: var(--card-2);
      color: var(--text);
      font-weight: 600;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-pill {
      height: 30px;
      min-width: 30px;
      padding: 0 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text-muted);
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: color 0.15s, border-color 0.15s;
    }

    .icon-pill:hover {
      color: var(--text);
      border-color: var(--text-muted);
    }

    /* 主卡片 */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 22px;
    }

    .view {
      display: none;
    }

    .view.active {
      display: block;
      animation: fadeIn 0.16s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* ---------- 专注视图 ---------- */
    .focus-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .status-text {
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-muted);
    }

    .status-dot.running {
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent-glow);
    }

    .count-text {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    .mode-bar {
      display: flex;
      background: var(--card-2);
      border-radius: 10px;
      padding: 3px;
      gap: 3px;
      margin-bottom: 20px;
    }

    .mode-btn {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 6px 8px;
      border-radius: 7px;
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }

    .mode-btn.active {
      background: var(--card);
      color: var(--text);
      font-weight: 600;
    }

    .custom-row {
      display: none;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .custom-row.show {
      display: flex;
    }

    .custom-input {
      width: 72px;
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card-2);
      color: var(--text);
      font-size: 0.85rem;
      text-align: center;
      outline: none;
    }

    .custom-input:focus {
      border-color: var(--accent);
    }

    .ring-box {
      position: relative;
      width: 210px;
      height: 210px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
    }

    .ring-box svg {
      position: absolute;
      inset: 0;
      transform: rotate(-90deg);
    }

    .ring-box circle {
      fill: none;
      stroke-width: 4;
    }

    .ring-track {
      stroke: var(--ring-track);
    }

    .ring-prog {
      stroke: var(--accent);
      stroke-linecap: round;
      transition: stroke-dashoffset 0.3s linear;
    }

    .time-main {
      font-size: 3.1rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      text-align: center;
      line-height: 1;
    }

    .time-sub {
      font-size: 0.78rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: 6px;
    }

    .task-input {
      width: 100%;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card-2);
      color: var(--text);
      font-size: 0.85rem;
      font-family: inherit;
      text-align: center;
      outline: none;
      margin-bottom: 16px;
      transition: border-color 0.15s;
    }

    .task-input::placeholder {
      color: var(--text-muted);
    }

    .task-input:focus {
      border-color: var(--accent);
    }

    .btn-row {
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    .btn {
      padding: 9px 22px;
      border-radius: 10px;
      border: none;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, background 0.15s;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      min-width: 110px;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: var(--card-2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      border-color: var(--text-muted);
    }

    /* ---------- 点阵年度进度（1:1 极简风格） ---------- */
    .matrix-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .matrix-title {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .matrix-meta {
      font-size: 0.88rem;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    .dot-grid {
      display: grid;
      grid-template-columns: repeat(19, 1fr);
      gap: 7px;
      margin-bottom: 18px;
    }

    .day-dot {
      aspect-ratio: 1;
      width: 100%;
      border-radius: 50%;
      background: var(--dot-future);
    }

    .day-dot.past {
      background: var(--dot-past);
    }

    .day-dot.today {
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow), 0 0 3px var(--accent);
      transform: scale(1.15);
    }

    .mini-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .mini-stat {
      text-align: center;
    }

    .mini-stat-val {
      font-size: 0.92rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .mini-stat-key {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
  </style>
</head>

      <nav class="seg-control" role="tablist">

        <button class="seg-btn" data-view="progress" id="navProgress">年度</button>

    <main class="card">
      <!-- 1. 专注倒计时 -->
      <section class="view active" id="view-focus">
        <div class="focus-top">
          <div class="status-text">
            <span class="status-dot" id="statusDot"></span>
            <span id="timerStatus">准备就绪</span>
          </div>
          <div class="count-text"><span id="todayLabel">今日完成</span> <strong id="completedCount">0</strong></div>
        </div>

        <div class="mode-bar">
          <button class="mode-btn active" data-minutes="25" data-key="pomodoro">25m</button>
          <button class="mode-btn" data-minutes="5" data-key="short">5m</button>
          <button class="mode-btn" data-minutes="15" data-key="long">15m</button>
          <button class="mode-btn" id="customModeBtn">自定义</button>
        </div>

        <div class="custom-row" id="customRow">
          <input type="number" class="custom-input" id="customInput" min="1" max="180" value="45" />
          <span id="minUnit" style="font-size: 0.8rem; color: var(--text-muted);">分钟</span>
          <button class="btn btn-secondary" id="applyCustomBtn" style="padding: 5px 12px; font-size: 0.8rem;">应用</button>
        </div>

        <div class="ring-box">
          <svg viewBox="0 0 210 210" width="210" height="210">
            <circle class="ring-track" cx="105" cy="105" r="96"></circle>
            <circle class="ring-prog" id="timerRing" cx="105" cy="105" r="96"></circle>
          </svg>
          <div>
            <div class="time-main" id="timerDisplay">25:00</div>
            <div class="time-sub" id="timerModeLabel">专注</div>
          </div>
        </div>

        <input type="text" class="task-input" id="taskInput" placeholder="输入当前专注事项（可选）..." />

        <div class="btn-row">
          <button class="btn btn-primary" id="timerStartBtn">开始</button>
          <button class="btn btn-secondary" id="timerResetBtn">重置</button>
        </div>
      </section>

      <!-- 2. 点阵年度进度 -->
      <section class="view" id="view-progress">
        <div class="matrix-head">
          <div class="matrix-title" id="matrixTitle">Week #47  2026</div>
          <div class="matrix-meta" id="matrixMeta">326/365 天 (89%)</div>
        </div>

        <div class="dot-grid" id="dotGrid"></div>

        <div class="mini-stats" id="miniStats"></div>
      </section>
    </main>

  <script>
    // ---------- 多语言 ----------
    const i18n = {
      zh: {
        navFocus: '专注',
        navProgress: '年度',
        ready: '准备就绪',
        running: '专注中',
        paused: '已暂停',
        done: '已完成',
        todayLabel: '今日完成',
        custom: '自定义',
        minUnit: '分钟',
        apply: '应用',
        taskPlaceholder: '输入当前专注事项（可选）...',
        start: '开始',
        pause: '暂停',
        resume: '继续',
        reset: '重置',
        modePomodoro: '专注',
        modeShort: '短休',
        modeLong: '长休',
        modeCustom: '自定义',
        dayUnit: '天',
        monthKey: '本月已过',
        weekKey: '本周已过',
        dayKey: '今日已过',
        notifyTitle: '倒计时结束',
        notifyBody: '休息一下吧'
      },
      en: {
        navFocus: 'Focus',
        navProgress: 'Year',
        ready: 'Ready',
        running: 'Focusing',
        paused: 'Paused',
        done: 'Completed',
        todayLabel: 'Today',
        custom: 'Custom',
        minUnit: 'min',
        apply: 'Apply',
        taskPlaceholder: 'Current focus task (optional)...',
        start: 'Start',
        pause: 'Pause',
        resume: 'Resume',
        reset: 'Reset',
        modePomodoro: 'Focus',
        modeShort: 'Short Break',
        modeLong: 'Long Break',
        modeCustom: 'Custom',
        dayUnit: 'd',
        monthKey: 'Month',
        weekKey: 'Week',
        dayKey: 'Today',
        notifyTitle: 'Time is up',
        notifyBody: 'Take a short break'
      }
    };

    let lang = localStorage.getItem('cecp_timer_lang') || 'zh';
    const langBtn = document.getElementById('langBtn');
    const t = k => i18n[lang][k] || k;

    function applyLang() {
      langBtn.textContent = lang === 'zh' ? 'EN' : '中';
      document.getElementById('navFocus').textContent = t('navFocus');
      document.getElementById('navProgress').textContent = t('navProgress');
      document.getElementById('todayLabel').textContent = t('todayLabel');
      document.getElementById('customModeBtn').textContent = t('custom');
      document.getElementById('minUnit').textContent = t('minUnit');
      document.getElementById('applyCustomBtn').textContent = t('apply');
      document.getElementById('taskInput').placeholder = t('taskPlaceholder');
      document.getElementById('timerResetBtn').textContent = t('reset');
      syncStateLabels();
      renderDotProgress();
    }

    langBtn.addEventListener('click', () => {
      lang = lang === 'zh' ? 'en' : 'zh';
      localStorage.setItem('cecp_timer_lang', lang);
      applyLang();
    });

    // ---------- 深浅色切换 ----------
    const html = document.documentElement;
    const themeBtn = document.getElementById('themeBtn');

    function setTheme(theme) {
      html.setAttribute('data-theme', theme);
      localStorage.setItem('cecp_minimal_theme', theme);
      themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
    }

    setTheme(localStorage.getItem('cecp_minimal_theme') || 'dark');
    themeBtn.addEventListener('click', () => {
      setTheme(html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });

    // ---------- 视图切换 ----------
    const segBtns = document.querySelectorAll('.seg-btn');
    const views = document.querySelectorAll('.view');
    segBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        segBtns.forEach(b => b.classList.remove('active'));
        views.forEach(v => v.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('view-' + btn.dataset.view).classList.add('active');
        if (btn.dataset.view === 'progress') renderDotProgress();
      });
    });

    // ---------- 任务记忆 ----------
    const taskInput = document.getElementById('taskInput');
    taskInput.value = localStorage.getItem('cecp_focus_task') || '';
    taskInput.addEventListener('input', () => localStorage.setItem('cecp_focus_task', taskInput.value));

    // ---------- 精准时间戳倒计时 ----------
    const COUNT_KEY = 'cecp_focus_completed_v1';
    const completedCountEl = document.getElementById('completedCount');
    const timerDisplay = document.getElementById('timerDisplay');
    const timerModeLabel = document.getElementById('timerModeLabel');
    const timerStatus = document.getElementById('timerStatus');
    const statusDot = document.getElementById('statusDot');
    const timerRing = document.getElementById('timerRing');
    const timerStartBtn = document.getElementById('timerStartBtn');
    const timerResetBtn = document.getElementById('timerResetBtn');
    const modeBtns = document.querySelectorAll('.mode-btn[data-minutes]');
    const customModeBtn = document.getElementById('customModeBtn');
    const customRow = document.getElementById('customRow');

    const CIRCUMFERENCE = 2 * Math.PI * 96;
    timerRing.style.strokeDasharray = CIRCUMFERENCE;

    let totalSeconds = 25 * 60;
    let remainingSeconds = totalSeconds;
    let endTimeMs = null;
    let timerInterval = null;
    let timerState = 'ready';
    let currentModeKey = 'pomodoro';

    function getTodayKey() {
      const d = new Date();
      return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
    }

    function loadCount() {
      try {
        const d = JSON.parse(localStorage.getItem(COUNT_KEY) || '{}');
        return d.date === getTodayKey() ? (d.count || 0) : 0;
      } catch { return 0; }
    }

    function addCount() {
      const next = loadCount() + 1;
      localStorage.setItem(COUNT_KEY, JSON.stringify({ date: getTodayKey(), count: next }));
      completedCountEl.textContent = next;
    }

    completedCountEl.textContent = loadCount();

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function syncStateLabels() {
      const modeMap = {
        pomodoro: t('modePomodoro'),
        short: t('modeShort'),
        long: t('modeLong'),
        custom: t('modeCustom')
      };
      timerModeLabel.textContent = modeMap[currentModeKey] || t('modePomodoro');

      statusDot.classList.toggle('running', timerState === 'running');
      if (timerState === 'running') {
        timerStatus.textContent = t('running');
        timerStartBtn.textContent = t('pause');
      } else if (timerState === 'paused') {
        timerStatus.textContent = t('paused');
        timerStartBtn.textContent = t('resume');
      } else if (timerState === 'done') {
        timerStatus.textContent = t('done');
        timerStartBtn.textContent = t('start');
      } else {
        timerStatus.textContent = t('ready');
        timerStartBtn.textContent = t('start');
      }
    }

    function updateTimerUI() {
      const str = formatTime(remainingSeconds);
      timerDisplay.textContent = str;
      document.title = timerState === 'running' ? `${str} · CECP` : 'CECP 专注空间';
      const ratio = totalSeconds > 0 ? remainingSeconds / totalSeconds : 0;
      timerRing.style.strokeDashoffset = CIRCUMFERENCE * (1 - ratio);
    }

    function playChime() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [523.25, 659.25, 783.99].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.001, ctx.currentTime + i * 0.14);
          gain.gain.exponentialRampToValueAtTime(0.15, ctx.currentTime + i * 0.14 + 0.04);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.14 + 0.55);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + i * 0.14);
          osc.stop(ctx.currentTime + i * 0.14 + 0.6);
        });
      } catch {}
    }

    function sendNotification() {
      if ('Notification' in window && Notification.permission === 'granted') {
        try {
          new Notification(t('notifyTitle'), { body: t('notifyBody') });
        } catch {}
      }
    }

    function stopInterval() {
      clearInterval(timerInterval);
      timerInterval = null;
    }

    function tick() {
      if (timerState !== 'running' || !endTimeMs) return;
      const diff = Math.max(0, Math.ceil((endTimeMs - Date.now()) / 1000));
      remainingSeconds = diff;
      updateTimerUI();

      if (diff <= 0) {
        stopInterval();
        timerState = 'done';
        endTimeMs = null;
        addCount();
        playChime();
        sendNotification();
        syncStateLabels();
        updateTimerUI();
      }
    }

    function setMinutes(mins, modeKey) {
      stopInterval();
      currentModeKey = modeKey;
      totalSeconds = mins * 60;
      remainingSeconds = totalSeconds;
      endTimeMs = null;
      timerState = 'ready';
      syncStateLabels();
      updateTimerUI();
    }

    modeBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        customRow.classList.remove('show');
        setMinutes(Number(btn.dataset.minutes), btn.dataset.key);
      });
    });

    customModeBtn.addEventListener('click', () => {
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      customModeBtn.classList.add('active');
      customRow.classList.add('show');
    });

    document.getElementById('applyCustomBtn').addEventListener('click', () => {
      const m = Math.max(1, Math.min(180, Number(document.getElementById('customInput').value) || 25));
      setMinutes(m, 'custom');
    });

    timerStartBtn.addEventListener('click', () => {
      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission().catch(() => {});
      }

      if (timerState === 'running') {
        tick();
        stopInterval();
        timerState = 'paused';
        endTimeMs = null;
        syncStateLabels();
        updateTimerUI();
        return;
      }

      if (remainingSeconds <= 0) remainingSeconds = totalSeconds;
      endTimeMs = Date.now() + remainingSeconds * 1000;
      timerState = 'running';
      syncStateLabels();
      updateTimerUI();
      timerInterval = setInterval(tick, 250);
    });

    timerResetBtn.addEventListener('click', () => {
      stopInterval();
      remainingSeconds = totalSeconds;
      endTimeMs = null;
      timerState = 'ready';
      syncStateLabels();
      updateTimerUI();
    });

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && timerState === 'running') tick();
    });

    // ---------- 点阵年度进度 ----------
    function getISOWeek(date) {
      const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
      const dayNum = d.getUTCDay() || 7;
      d.setUTCDate(d.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
      return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    }

    function renderDotProgress() {
      const now = new Date();
      const year = now.getFullYear();
      const startOfYear = new Date(year, 0, 1);
      const endOfYear = new Date(year + 1, 0, 1);
      const totalDays = Math.round((endOfYear - startOfYear) / 86400000);
      const todayIdx = Math.floor((new Date(year, now.getMonth(), now.getDate()) - startOfYear) / 86400000) + 1;
      const yearPct = Math.round((todayIdx / totalDays) * 100);
      const weekNum = getISOWeek(now);

      document.getElementById('matrixTitle').textContent = `Week #${weekNum}  ${year}`;
      document.getElementById('matrixMeta').textContent = `${todayIdx}/${totalDays} ${t('dayUnit')} (${yearPct}%)`;

      const dotGrid = document.getElementById('dotGrid');
      const dots = [];
      for (let i = 1; i <= totalDays; i++) {
        const d = new Date(year, 0, i);
        const dateStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        let cls = 'day-dot';
        if (i < todayIdx) cls += ' past';
        else if (i === todayIdx) cls += ' today';
        dots.push(`<div class="${cls}" title="${dateStr}"></div>`);
      }
      dotGrid.innerHTML = dots.join('');

      const startOfMonth = new Date(year, now.getMonth(), 1);
      const endOfMonth = new Date(year, now.getMonth() + 1, 1);
      const monthPct = ((now - startOfMonth) / (endOfMonth - startOfMonth)) * 100;

      const dayOfWeek = (now.getDay() + 6) % 7;
      const startOfWeek = new Date(year, now.getMonth(), now.getDate() - dayOfWeek);
      const weekPct = ((now - startOfWeek) / (7 * 86400000)) * 100;

      const startOfDay = new Date(year, now.getMonth(), now.getDate());
      const dayPct = ((now - startOfDay) / 86400000) * 100;

      document.getElementById('miniStats').innerHTML = [
        { k: t('monthKey'), v: monthPct.toFixed(1) + '%' },
        { k: t('weekKey'), v: weekPct.toFixed(1) + '%' },
        { k: t('dayKey'), v: dayPct.toFixed(1) + '%' }
      ].map(s => `
        <div class="mini-stat">
          <div class="mini-stat-val">${s.v}</div>
          <div class="mini-stat-key">${s.k}</div>
        </div>
      `).join('');
    }

    applyLang();
    updateTimerUI();
  </script>
</body>
</html>
